# watashi v12.3.40dev: the old project name was taken out of this file (names, paths and links only)
# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  # push:
  #   branches: [ main ]
  # pull_request:
  #   branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v2
      - name: Install project
        run: |
          sudo mkdir /opt/watashi-manager
          sudo cp -r * /opt/watashi-manager/
          cd /opt/watashi-manager/
          sudo bash install.sh
      - name: check working
        env:
          SQLALCHEMY_DATABASE_URI: sqlite:////opt/watashi-manager/watashi-panel/database.db
        run: |
          cd /opt/watashi-manager/
          grep -q -e '-----Finished!-----' log/system/0-install.log 
          source common/utils.sh
          watashi-panel-cli all-configs
