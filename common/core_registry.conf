# watashi v12.2.50: the core registry.
#
# one line per core, so the panel and the scripts stop disagreeing about where
# a core lives and which version is blessed.
#
# name|repo|kind|asset_amd64|asset_arm64|install_path|unit|version_cmd|tested_min|tested_max|stable_max|channel|optional
#
#   kind        zip, tgz or bin
#   asset_*     the release file name, @V@ is the version
#   install_path  relative to /opt/hiddify-manager
#   unit        systemd unit without .service, or - when the core has none
#   version_cmd  @BIN@ is the staged binary; it must exit 0 and print something
#   tested_min  the oldest version this panel was tested with
#   tested_max  the newest version this panel was tested with
#   stable_max  the newest version the vendor calls a release, tested here too
#   optional    yes when the core only lands on the disk after the feature
#               that needs it is switched on. an empty path for one of those
#               is the normal state, not a fault.
#   channel     stable or pre. stable is the default and it is what an upgrade
#               with no version installs. pre is never chosen by the panel: a
#               test build is only installed by someone typing its number.
#
# watashi v12.2.84: 26.3.27 is the base version of this panel.
#   tested_max, stable_max and the whole audit now point at one number, so
#   an install, an upgrade with no version, a repair and a rollback all land
#   on the same core, on a beta panel exactly as on a release panel. The
#   panel channel is never read here. A test build is reached only when
#   somebody types its number on the cores page, and that choice, with
#   whatever it brings, belongs to whoever makes it.
#   On the server the lock file follows this line:
#     bash common/bump_cores.sh pin xray 26.3.27
#
# watashi v12.2.83: wgcf ships with warp and the v2ray plugin ships with the
# shadowsocks plugin, so on a server where neither feature was ever turned on
# those two files simply do not exist. the page used to count them as broken
# cores; field 13 lets it say "optional" instead.
#
# watashi v12.2.82: the xray vendor publishes nearly every release as a
# pre-release, so api.github.com/repos/XTLS/Xray-core/releases/latest answers
# 26.3.27 while the newest tag is 26.7.28. v12.2.75 moved tested_max to
# 26.7.28, and a bare upgrade installs tested_max, which is how this server
# ended up on a test build with nobody asking for one. tested_max stays where
# the audit work was done; stable_max is what the panel installs on its own.
#
# watashi v12.2.75: xray moves from 26.3.27 to 26.7.28, ten releases of
# change. Two of them remove things this panel was still sending: the mKCP
# seed field and the HTTP/2 transport. Both are handled in this same round.
# packages.lock still has to be re-pinned on the server, where there is network:
#   bash common/bump_cores.sh pin xray 26.7.28
# watashi v12.2.93: wgcf has no --version.
#   installing it failed on the probe with "wgcf did not answer", and the
#   probe was right: the tool is built on cobra, and cobra only creates a
#   --version flag when the root command carries a Version field. wgcf
#   does not set one, so the flag has never existed on any release, and
#   running it exits non-zero with "unknown flag". field 8 is now -, which
#   means the probe checks that the file is a runnable program instead of
#   asking it to speak. the version on the page then comes from the install
#   record, which is written the moment an install succeeds.
#   The other five cores are unaffected: xray and singbox answer "version",
#   mtg answers "--version", and the last two were already on -.
#   watashi v12.2.98: singbox is taken from mn-hacker/Watashi-Custom-SingBox
#   from here on. That repository builds the untouched upstream SagerNet
#   source with the build tags the official release uses plus with_v2ray_api,
#   which is the one service in sing-box that keeps a running traffic total
#   per user. The version reads <upstream>.w<n>, so 1.14.0.w1 is the first
#   Watashi build of upstream 1.14.0 and the leading part of every tag names
#   the real upstream release. A change on our side bumps only the w number.
# watashi v12.2.103: mita is the mieru server. sing-box cannot serve
#   this protocol at all - 1.14.0 answers "unknown inbound type: mieru" -
#   so it is a core of its own with a service of its own. It is optional
#   because the file only lands on the disk once mieru is switched on.
xray|XTLS/Xray-core|zip|Xray-linux-64.zip|Xray-linux-arm64-v8a.zip|xray/bin/xray|hiddify-xray|@BIN@ version|26.3.27|26.3.27|26.3.27|stable|no
singbox|mn-hacker/Watashi-Custom-SingBox|tgz|sing-box-@V@-linux-amd64.tar.gz|sing-box-@V@-linux-arm64.tar.gz|singbox/sing-box|hiddify-singbox|@BIN@ version|1.14.0.w1|1.14.0.w1|1.14.0.w1|stable|no
