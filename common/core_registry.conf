# watashi v12.2.50: the core registry.
#
# one line per core, so the panel and the scripts stop disagreeing about where
# a core lives and which version is blessed.
#
# name|repo|kind|asset_amd64|asset_arm64|install_path|unit|version_cmd|tested_min|tested_max|stable_max|channel
#
#   kind        zip, tgz or bin
#   asset_*     the release file name, @V@ is the version
#   install_path  relative to /opt/hiddify-manager
#   unit        systemd unit without .service, or - when the core has none
#   version_cmd  @BIN@ is the staged binary; it must exit 0 and print something
#   tested_min  the oldest version this panel was tested with
#   tested_max  the newest version this panel was tested with
#   stable_max  the newest version the vendor calls a release, tested here too
#   channel     stable or pre. stable is the default and it is what an upgrade
#               with no version installs. pre is never chosen by the panel: a
#               test build is only installed by someone typing its number.
#
# watashi v12.2.82: the xray vendor publishes nearly every release as a
# pre-release, so api.github.com/repos/XTLS/Xray-core/releases/latest answers
# 26.3.27 while the newest tag is 26.7.28. v12.2.75 moved tested_max to
# 26.7.28, and a bare upgrade installs tested_max, which is how this server
# ended up on a test build with nobody asking for one. tested_max stays where
# the audit work was done; stable_max is what the panel installs on its own.
#
# watashi v12.2.75: xray moves from 26.3.27 to 26.7.28, ten releases of
# change. Two of them remove things this panel was still sending: the mKCP
# seed field and the HTTP/2 transport. Both are handled in this same round.
# packages.lock still has to be re-pinned on the server, where there is network:
#   bash common/bump_cores.sh pin xray 26.7.28
xray|XTLS/Xray-core|zip|Xray-linux-64.zip|Xray-linux-arm64-v8a.zip|xray/bin/xray|hiddify-xray|@BIN@ version|26.3.27|26.7.28|26.3.27|stable
singbox|mn-hacker/Hiddify-Custom-SingBox|tgz|sing-box-@V@-linux-amd64.tar.gz|sing-box-@V@-linux-arm64.tar.gz|singbox/sing-box|hiddify-singbox|@BIN@ version|1.13.0.h10|1.13.0.h10|1.13.0.h10|stable
mtproxygo|9seconds/mtg|tgz|mtg-@V@-linux-amd64.tar.gz|mtg-@V@-linux-arm64.tar.gz|other/telegram/tgo/mtg|mtproxy|@BIN@ --version|2.1.7|2.1.7|2.1.7|stable
wgcf|ViRb3/wgcf|bin|wgcf_@V@_linux_amd64|wgcf_@V@_linux_arm64|other/warp/singbox/wgcf|-|@BIN@ --version|2.2.29|2.2.29|2.2.29|stable
ssh-liberty-bridge|hiddify/ssh-liberty-bridge|bin|ssh-liberty-bridge-amd64|ssh-liberty-bridge-arm64|other/ssh/ssh-liberty-bridge|hiddify-ssh-liberty-bridge|-|1.3.0|1.3.0|1.3.0|stable
