# watashi v12.2.50: the core registry.
#
# one line per core, so the panel and the scripts stop disagreeing about where
# a core lives and which version is blessed.
#
# name|repo|kind|asset_amd64|asset_arm64|install_path|unit|version_cmd|tested_min|tested_max
#
#   kind        zip, tgz or bin
#   asset_*     the release file name, @V@ is the version
#   install_path  relative to /opt/hiddify-manager
#   unit        systemd unit without .service, or - when the core has none
#   version_cmd  @BIN@ is the staged binary; it must exit 0 and print something
#   tested_min  the oldest version this panel was tested with
#   tested_max  the version this panel ships with, the safe default
#
# watashi v12.2.75: xray moves from 26.3.27 to 26.7.28, ten releases of
# change. Two of them remove things this panel was still sending: the mKCP
# seed field and the HTTP/2 transport. Both are handled in this same round.
# packages.lock still has to be re-pinned on the server, where there is network:
#   bash common/bump_cores.sh pin xray 26.7.28
xray|XTLS/Xray-core|zip|Xray-linux-64.zip|Xray-linux-arm64-v8a.zip|xray/bin/xray|hiddify-xray|@BIN@ version|26.7.28|26.7.28
singbox|mn-hacker/Hiddify-Custom-SingBox|tgz|sing-box-@V@-linux-amd64.tar.gz|sing-box-@V@-linux-arm64.tar.gz|singbox/sing-box|hiddify-singbox|@BIN@ version|1.13.0.h10|1.13.0.h10
mtproxygo|9seconds/mtg|tgz|mtg-@V@-linux-amd64.tar.gz|mtg-@V@-linux-arm64.tar.gz|other/telegram/tgo/mtg|mtproxy|@BIN@ --version|2.1.7|2.1.7
wgcf|ViRb3/wgcf|bin|wgcf_@V@_linux_amd64|wgcf_@V@_linux_arm64|other/warp/singbox/wgcf|-|@BIN@ --version|2.2.29|2.2.29
ssh-liberty-bridge|hiddify/ssh-liberty-bridge|bin|ssh-liberty-bridge-amd64|ssh-liberty-bridge-arm64|other/ssh/ssh-liberty-bridge|hiddify-ssh-liberty-bridge|-|1.3.0|1.3.0
v2ray-plugin|shadowsocks/v2ray-plugin|tgz|v2ray-plugin-linux-amd64-v@V@.tar.gz|v2ray-plugin-linux-arm64-v@V@.tar.gz|other/v2ray/v2ray-plugin_linux|-|-|1.3.2|1.3.2
